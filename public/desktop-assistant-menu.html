<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HasarBotu Hızlı İşlemler</title><link rel="stylesheet" href="/desktop-assistant-menu.css"><script src="/desktop-assistant-menu.js" defer></script></head>
<body><main aria-label="HasarBotu hızlı işlemler">
  <header><div class="brand">H</div><div><strong>HasarBotu</strong><span>Hızlı işlemler</span></div><button class="close" data-action="close" aria-label="Menüyü kapat">×</button></header>
  <button class="open" data-action="open"><span>Çalışma alanını aç</span><span aria-hidden="true">↗</span></button>
  <section class="shortcuts" aria-label="Kısayollar">
    <button data-action="note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14v-9M10 14l2-5 7-7 3 3-7 7-5 2Z"/></svg><strong>Hızlı not</strong><small>Seçili dosyaya</small></button>
    <button data-action="cases"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6l2 3h10v12H3V5Z"/></svg><strong>Dosyalar</strong><small>Ara ve görüntüle</small></button>
    <button data-action="notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16h14l-2-3V8a5 5 0 0 0-10 0v5l-2 3Zm5 4h4"/></svg><strong>Bildirimler</strong><small>Size ait gelişmeler</small></button>
    <button data-action="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg><strong>Ayarlar</strong><small>Hesap ve görünüm</small></button>
  </section>
  <footer><button data-action="hide">Yardımcıyı gizle</button><button data-action="reset">Konumu sıfırla</button><button class="quit" data-action="quit">Çıkış</button></footer>
</main></body></html>
